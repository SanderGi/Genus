name = "multi-genus"
version = "0.1.0"
defaultTargets = ["MultiGenus"]
testDriver = "CheckMultiGenus"
lintDriver = "batteries/runLinter"
lintDriverArgs = ["MultiGenus"]
builtinLint = true

[leanOptions]
warningAsError = true
weak.linter.mathlibStandardSet = true
weak.linter.style.header.license = "SPDX-License-Identifier: GPL-2.0-only"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.36.0"

[[lean_lib]]
name = "MultiGenus"
srcDir = "lean"

[[lean_lib]]
name = "CheckMultiGenus"
srcDir = "lean"
